# n8n for LoopCasts, running next to the DDEV site.
# It joins DDEV's network (ddev_default) so that:
#  - DDEV's web container can reach it as http://n8n:5678   (the payment webhook)
#  - n8n can reach the site as http://ddev-loopcasts-web   (the payment API)
#  - n8n can reach the database as ddev-loopcasts-db:3306
# Start DDEV first (`ddev start` in the project folder), then `docker compose up -d` here.
name: loopcasts-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest      # pin a version tag once it works (see README)
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"                    # only reachable from this computer
    environment:
      - GENERIC_TIMEZONE=Europe/Brussels         # makes schedule triggers fire at Belgian time
      - TZ=Europe/Brussels
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY} # encrypts the credentials stored in n8n
    volumes:
      - n8n_data:/home/node/.n8n                 # workflows, credentials and executions live here
    networks:
      - ddev_default

networks:
  ddev_default:
    external: true

volumes:
  n8n_data: